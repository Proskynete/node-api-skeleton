name: "📋 Lint YAML"

on:
  push:
    paths:
      - "**.yml"
      - "**.yaml"
      - ".github/workflows/**"

jobs:
  yamllint:
    name: Validate YAML Syntax
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: 📦 Install yamllint
        run: pip install yamllint

      - name: 🔍 Lint YAML Files
        run: yamllint .
